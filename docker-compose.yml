version: "3"

services:
  backend:
    build: ./backend
    container_name: backend
    environment:
      MONGO_URI: your_mongodb_atlas_connection_string
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
